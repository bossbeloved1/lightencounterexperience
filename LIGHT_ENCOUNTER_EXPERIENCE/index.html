<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090504"><meta name="description" content="Light Encounter Experience — EPHPHATHA">
  <title>EPHPHATHA | Light Encounter Experience</title>
  <link rel="icon" href="assets/images/lee-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="fire-haze" aria-hidden="true"></div>
  <header class="brand-lockup">
    <a class="brand" href="index.html" aria-label="Light Encounter Experience home">
      <img src="assets/images/lee-mark.svg" alt="" class="brand-mark">
      <span class="brand-name">LIGHT ENCOUNTER<small>EXPERIENCE</small></span>
    </a>
  </header>
  <main class="hero">
    <div class="eyebrow"><span></span> LIGHT ENCOUNTER EXPERIENCE <span></span></div>
    <p class="theme-label">THEME</p>
    <h1 class="theme-title">EPHPHATHA</h1>
    <p class="hero-subtitle">BE OPENED.</p>
    <a class="register-cta" id="registerCta" href="register.html">
      <span class="cta-orbit" aria-hidden="true"></span>
      <span class="cta-content"><small>YOUR ENCOUNTER BEGINS HERE</small><strong>CLICK HERE TO REGISTER <b>↗</b></strong></span>
    </a>
    <div class="hero-foot"><span class="rule"></span><span>AN ENCOUNTER THAT OPENS YOU TO MORE</span><span class="rule"></span></div>
  </main>
  <audio id="entrySound" preload="auto" src="assets/sounds.mp3"></audio>
  <script src="js/effects.js"></script><script src="js/fire-cursor.js"></script>
  <script>
    (function () {
      const cta = document.getElementById('registerCta');
      const audio = document.getElementById('entrySound');
      let registrationFrame = null;

      cta.addEventListener('click', function (event) {
        event.preventDefault();
        if (registrationFrame) return;

        // Start audio from the user's click, then load registration immediately.
        if (audio) {
          audio.currentTime = 0;
          const playback = audio.play();
          if (playback && typeof playback.catch === 'function') {
            playback.catch(function () {
              // Navigation still proceeds if the browser cannot play the audio.
            });
          }
        }

        registrationFrame = document.createElement('iframe');
        registrationFrame.src = cta.href;
        registrationFrame.title = 'Light Encounter Experience registration';
        registrationFrame.setAttribute('allow', 'autoplay');
        registrationFrame.style.cssText =
          'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:10000;background:#090504;';
        document.body.appendChild(registrationFrame);
        document.documentElement.classList.add('lee-registration-open');

        // Update the address bar to the registration URL without unloading this
        // page, so the sound can continue playing in the parent document.
        history.pushState({ leeRegistration: true }, '', cta.href);
        document.title = 'Registration | EPHPHATHA';
      });

      function returnHomeFromRegistration() {
        if (registrationFrame) {
          registrationFrame.remove();
          registrationFrame = null;
        }
        document.documentElement.classList.remove('lee-registration-open');
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
        // Replace the registration URL immediately instead of relying on an
        // asynchronous history.back() event.
        const homeUrl = new URL('index.html', window.location.href);
        history.replaceState({ leeHome: true }, '', homeUrl.pathname + homeUrl.search + homeUrl.hash);
        document.title = 'EPHPHATHA | Light Encounter Experience';
      }

      // Expose a same-origin return function for the embedded registration page.
      window.__LEE_RETURN_HOME = returnHomeFromRegistration;

      window.addEventListener('message', function (event) {
        if (registrationFrame && event.source === registrationFrame.contentWindow &&
            event.data && event.data.type === 'LEE_RETURN_HOME') {
          returnHomeFromRegistration();
        }
      });

      // Browser Back also closes registration and stops the entry music.
      window.addEventListener('popstate', function () {
        if (registrationFrame) {
          registrationFrame.remove();
          registrationFrame = null;
        }
        document.documentElement.classList.remove('lee-registration-open');
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
        document.title = 'EPHPHATHA | Light Encounter Experience';
      });
    })();
  </script>
</body></html>
