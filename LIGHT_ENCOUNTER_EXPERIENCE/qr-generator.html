
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Generator | LEE</title>
<link rel="icon" href="assets/images/lee-mark.svg">
<link rel="stylesheet" href="css/style.css">
</head>

<body class="qr-page">

<canvas id="embers"></canvas>

<header class="inner-header">
    <a class="brand" href="index.html">
        <img src="assets/images/lee-mark.svg" class="brand-mark" alt="">
        <span class="brand-name">
            LIGHT ENCOUNTER
            <small>EXPERIENCE</small>
        </span>
    </a>

    <a class="back-link" href="admin/login.html">ADMIN LOGIN →</a>
</header>

<main class="qr-wrap">

    <p class="eyebrow">PUBLICITY TOOL</p>

    <h1>GENERATE YOUR <em>QR CODE.</em></h1>

    <p class="muted">
        Paste your deployed homepage link to create a scannable code for your publicity materials.
    </p>

    <div class="qr-card">

        <label>
            Website URL
            <input
                id="siteUrl"
                type="url"
                placeholder="https://your-website.com"
            >
        </label>

        <button class="submit-cta" id="generateQr">
            GENERATE QR CODE <b>↗</b>
        </button>

        <div id="qrOutput" class="qr-output">
            <span>Your QR code will appear here.</span>
        </div>

        <button class="outline-btn" id="downloadQr" disabled>
            DOWNLOAD QR CODE
        </button>

    </div>

</main>

<script src="js/qr.js"></script>

</body>
</html>
